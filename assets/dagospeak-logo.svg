<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé principal -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A8A6E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d9e7f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#087a62;stop-opacity:1" />
    </linearGradient>

    <!-- Ombre portée 3D -->
    <filter id="shadow3d" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Effet de relief -->
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </linearGradient>

    <!-- Dégradé pour le cercle orange -->
    <radialGradient id="orangeGrad" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#f5c842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A33D;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Ombre portée principale -->
  <rect x="20" y="30" width="472" height="472" rx="96" fill="#000" opacity="0.2" filter="url(#shadow3d)"/>

  <!-- Corps principal avec dégradé -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#mainGrad)"/>

  <!-- Effet de biseau 3D -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bevel)"/>

  <!-- Bordure intérieure pour effet de profondeur -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>

  <!-- Texte DS avec effet 3D -->
  <text x="256" y="280" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, Arial, sans-serif" font-size="220" font-weight="700"
        fill="#000000" opacity="0.3" transform="translate(4, 6)">DS</text>

  <text x="256" y="280" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, Arial, sans-serif" font-size="220" font-weight="700"
        fill="#FFFFFF">DS</text>

  <!-- Cercle orange avec effet 3D -->
  <circle cx="400" cy="120" r="44" fill="#000" opacity="0.2" transform="translate(2, 4)"/>
  <circle cx="400" cy="120" r="40" fill="url(#orangeGrad)"/>
  <circle cx="400" cy="120" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

  <!-- Reflet sur le cercle -->
  <ellipse cx="390" cy="110" rx="15" ry="10" fill="#ffffff" opacity="0.4"/>
</svg>