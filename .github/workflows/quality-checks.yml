name: DagoSpeak quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # The PWA version bot only changes CACHE_VERSION; avoid duplicate checks.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run project quality checks
        run: npm test
