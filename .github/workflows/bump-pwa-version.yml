name: Bump PWA version on production changes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-service-worker:
    # Prevent the bot's own version-bump commit from starting another run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Increment service worker cache version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(grep -m1 "const CACHE_VERSION" sw.js | cut -d"'" -f2 | tr -d 'v')"
          if [[ -z "${current_version}" ]]; then
            echo "::error::CACHE_VERSION not found in sw.js"
            exit 1
          fi

          next_version=$((current_version + 1))
          sed -i "s/const CACHE_VERSION = 'v${current_version}';/const CACHE_VERSION = 'v${next_version}';/" sw.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "chore(pwa): bump service worker cache to v${next_version}"
          git push origin HEAD:main
