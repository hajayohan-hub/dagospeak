<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DagoSpeak - Apprenez le français facilement" />
  <meta name="theme-color" content="#0A8A6E" />
  <title>DagoSpeak</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/dagospeak-logo.svg" />
  <link rel="stylesheet" href="/src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="/src/ui/styles/base.css" />
  <link rel="stylesheet" href="/src/ui/styles/animations.css" />
  <link rel="stylesheet" href="/src/ui/styles/home-animations.css" />
  <link rel="stylesheet" href="/src/ui/styles/utilities.css" />
</head>

<body>
  <!-- HEADER : toujours en haut -->
<header id="main-header" style="position: fixed; top: 0; left: 0; right: 0; background: var(--ds-color-surface); border-bottom: 1px solid var(--ds-color-border); padding: 0.75rem 1rem; z-index: 1000; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--ds-shadow-sm);">
  <div id="header-logo" style="display: flex; align-items: center; gap: 0.5rem; font-weight: bold; font-size: 1.25rem; color: var(--ds-color-primary); cursor: pointer;">
    <img id="logo-svg" src="/assets/dagospeak-logo.svg" alt="DagoSpeak" style="width: 32px; height: 32px;" />
    <span>DagoSpeak</span>
  </div>
  <div style="display: flex; gap: 0.5rem; align-items: center;">
    <button id="btn-languages" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;" title="Langues">🌐</button>
    <button id="btn-settings" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;" title="Réglages">⚙️</button>
    <button id="btn-about" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;" title="À propos">ℹ️</button>
    <button id="theme-toggle" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;">🌓</button>
  </div>
</header>

<!-- MAIN : descend pour laisser place au header + scores -->
<main id="app" style="padding-top: 110px; padding-bottom: 100px; min-height: 100vh;">
  <!-- Écran de chargement visible immédiatement -->
  <div id="app-splash" style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 1.5rem;
    animation: splash-fadeIn 0.3s ease-out;
  ">
    <div style="
      width: 48px;
      height: 48px;
      border: 4px solid rgba(10, 138, 110, 0.2);
      border-top-color: #0A8A6E;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    "></div>
    <p style="
      font-size: 1.1rem;
      font-weight: 600;
      color: #0A8A6E;
      margin: 0;
    ">Mamakiana...</p>
    <p style="
      font-size: 0.9rem;
      color: #666;
      margin: 0;
    ">Chargement de DagoSpeak</p>
  </div>
</main>

<style>
  @keyframes splash-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes splash-fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes splash-fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
</style>

  <nav class="ds-mobile-nav" style="position: fixed; bottom: 0; left: 0; right: 0; background: var(--ds-color-surface); border-top: 1px solid var(--ds-color-border); display: flex; justify-content: space-around; padding: 0.5rem 0; z-index: 1000;">
    <a href="#/" data-route="/" style="text-decoration: none; color: var(--ds-color-text-muted); font-size: 1.4rem; text-align: center; flex: 1;">🏠<br><span style="font-size:0.65rem; font-weight: 600;">Accueil</span></a>
    <a href="#/themes" data-route="/themes" style="text-decoration: none; color: var(--ds-color-text-muted); font-size: 1.4rem; text-align: center; flex: 1;">📚<br><span style="font-size:0.65rem; font-weight: 600;">Thèmes</span></a>
    <a href="#/profile" data-route="/profile" style="text-decoration: none; color: var(--ds-color-text-muted); font-size: 1.4rem; text-align: center; flex: 1;">👤<br><span style="font-size:0.65rem; font-weight: 600;">Profil</span></a>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
