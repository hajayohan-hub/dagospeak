<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="DagoSpeak - Apprenez le français facilement" />
  <meta name="theme-color" content="#2563eb" />
  <title>DagoSpeak</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/dagospeak-logo.svg" />
  <link rel="stylesheet" href="/src/ui/styles/tokens.css" />
  <link rel="stylesheet" href="/src/ui/styles/base.css" />
  <script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
  <link rel="stylesheet" href="/src/ui/styles/animations.css">
  <link rel="stylesheet" href="/src/ui/styles/home-animations.css">

    <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MOTEUR D'ANIMATIONS MODERNES (Léger & Fluide) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <style>
    /* 1. Flottement doux et continu (pour les icônes) */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* 2. Apparition en cascade (Fade In + Slide Up) */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 3. Pulsation douce (pour le guidage) */
    @keyframes softPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    /* 4. Rebond au clic (Feedback tactile satisfaisant) */
    @keyframes tapBounce {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    /* --- APPLICATION DES CLASSES --- */

    /* Les icônes flottent doucement */
    .icon-float {
      animation: float 3s ease-in-out infinite;
      display: inline-block;
    }

    /* Les cartes apparaissent avec un délai en cascade */
    .card-animate {
      animation: fadeInUp 0.5s ease-out forwards;
      opacity: 0; /* Commence invisible pour l'animation */
    }
    /* Délais en cascade pour un effet "vague" professionnel */
    .card-animate:nth-child(1) { animation-delay: 0.1s; }
    .card-animate:nth-child(2) { animation-delay: 0.15s; }
    .card-animate:nth-child(3) { animation-delay: 0.2s; }
    .card-animate:nth-child(4) { animation-delay: 0.25s; }
    .card-animate:nth-child(5) { animation-delay: 0.3s; }
    .card-animate:nth-child(6) { animation-delay: 0.35s; }
    .card-animate:nth-child(7) { animation-delay: 0.4s; }
    .card-animate:nth-child(8) { animation-delay: 0.45s; }
    .card-animate:nth-child(9) { animation-delay: 0.5s; }
    .card-animate:nth-child(10) { animation-delay: 0.55s; }

    /* Feedback interactif au survol et au clic */
    .interactive-tap {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    .interactive-tap:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
    }
    .interactive-tap:active {
      animation: tapBounce 0.15s ease;
    }

    /* Uniformisation du guidage par allumage */
    .guide-active {
      animation: softPulse 2s infinite !important;
      border: 2px solid var(--ds-color-primary) !important;
    }
  </style>

    <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MOTEUR D'ANIMATIONS MODERNES (Léger, 60 FPS, Économe en batterie) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <style>
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes pulse-guide { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); transform: scale(1); } 70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); transform: scale(1.03); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); transform: scale(1); } }
    @keyframes pulse-green { 0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(47, 158, 68, 0.7); } 70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(47, 158, 68, 0); } 100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(47, 158, 68, 0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes tapBounce { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }

    .icon-float { animation: float 3s ease-in-out infinite; display: inline-block; }
    .card-animate { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
    .card-animate:nth-child(1) { animation-delay: 0.1s; }
    .card-animate:nth-child(2) { animation-delay: 0.15s; }
    .card-animate:nth-child(3) { animation-delay: 0.2s; }
    .card-animate:nth-child(4) { animation-delay: 0.25s; }
    .card-animate:nth-child(5) { animation-delay: 0.3s; }

    .interactive-tap { transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; }
    .interactive-tap:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.12); }
    .interactive-tap:active { animation: tapBounce 0.15s ease; }

    /* ✅ Guidage par allumage permanent */
    .guide-active { animation: pulse-guide 2s infinite !important; border: 2px solid var(--ds-color-primary) !important; }

    /* ✅ Feedback visuel Quiz */
    .correct-answer { animation: tapBounce 0.4s ease; background: var(--ds-color-success-soft) !important; }
    .wrong-answer { animation: tapBounce 0.4s ease; background: var(--ds-color-danger-soft) !important; }
  </style>
</head>

<body>
  <!-- HEADER : toujours en haut -->
<header id="main-header" style="position: fixed; top: 0; left: 0; right: 0; background: var(--ds-color-surface); border-bottom: 1px solid var(--ds-color-border); padding: 0.75rem 1rem; z-index: 1000; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--ds-shadow-sm);">
  <div id="header-logo" style="display: flex; align-items: center; gap: 0.5rem; font-weight: bold; font-size: 1.25rem; color: var(--ds-color-primary); cursor: pointer;">
    <img id="logo-svg" src="/assets/dagospeak-logo.svg" alt="DagoSpeak" style="width: 32px; height: 32px;" />
    <span>DagoSpeak</span>
  </div>
  <div style="display: flex; gap: 0.5rem; align-items: center;">
    <button id="btn-languages" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;" title="Langues">🌐</button>
    <button id="btn-settings" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;" title="Réglages">⚙️</button>
    <button id="btn-about" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;" title="À propos">ℹ️</button>
    <button id="theme-toggle" style="background: var(--ds-color-surface-2); border: 1px solid var(--ds-color-border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem;">🌓</button>
  </div>
</header>

<!-- MAIN : descend pour laisser place au header + scores -->
<main id="app" style="padding-top: 110px; padding-bottom: 100px; min-height: 100vh;"></main>

  <nav class="ds-mobile-nav" style="position: fixed; bottom: 0; left: 0; right: 0; background: var(--ds-color-surface); border-top: 1px solid var(--ds-color-border); display: flex; justify-content: space-around; padding: 0.5rem 0; z-index: 1000;">
    <a href="#/" data-route="/" style="text-decoration: none; color: var(--ds-color-text-muted); font-size: 1.4rem; text-align: center; flex: 1;">🏠<br><span style="font-size:0.65rem; font-weight: 600;">Accueil</span></a>
    <a href="#/themes" data-route="/themes" style="text-decoration: none; color: var(--ds-color-text-muted); font-size: 1.4rem; text-align: center; flex: 1;">📚<br><span style="font-size:0.65rem; font-weight: 600;">Thèmes</span></a>
    <a href="#/profile" data-route="/profile" style="text-decoration: none; color: var(--ds-color-text-muted); font-size: 1.4rem; text-align: center; flex: 1;">👤<br><span style="font-size:0.65rem; font-weight: 600;">Profil</span></a>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
